name: CH8 SmallSort REV2 N32 closure for general Wide and stable u64
'on':
  push:
    branches:
      - uninit-ci/ch8-q-pilot-v1
permissions:
  contents: read
concurrency:
  group: ch8-rev2-gen-stable-n32-closure-${{ github.run_id }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  ubuntu:
    if: ${{ github.repository == 'Tiramisu-Cake/kani' && github.event_name == 'push' && github.ref == 'refs/heads/uninit-ci/ch8-q-pilot-v1' && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CH8_REV2_GEN_STABLE_N32_CLOSURE_TRIGGER_TREE: ${{ vars.CH8_REV2_GEN_STABLE_N32_CLOSURE_TRIGGER_TREE }}
    steps:
      - name: Start the monotonic job clock
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import time
          epoch = time.monotonic()
          import os
          from pathlib import Path
          state = Path(os.environ["RUNNER_TEMP"]) / "ch8-rev2-gen-stable-n32-closure"
          state.mkdir()
          (state / "epoch").write_text(f"{epoch}\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print(f"REV2_STATE={state}", file=output)
          PY
      - name: Checkout exact control
        timeout-minutes: 2
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Validate control and frozen request
        id: pins
        timeout-minutes: 10
        working-directory: control/ch8-cal1
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python3 run.py pins
          timeout --kill-after=5s 150s python3 -m unittest discover -v
          for start_seconds in 1 5 60; do
            printf 'Self-test with monotonic starting at %s s\n' "$start_seconds"
            timeout --kill-after=5s 150s python3 - "$start_seconds" <<'PY'
          import sys
          import time
          import unittest

          initial_seconds = int(sys.argv[1])
          native_clock = time.monotonic
          started = native_clock()
          time.monotonic = lambda: initial_seconds + (native_clock() - started)
          unittest.main(module=None, argv=["unittest", "discover", "-v"])
          PY
          done
      - name: Checkout std base
        timeout-minutes: 5
        uses: actions/checkout@v6
        with:
          repository: Tiramisu-Cake/verify-rust-std
          ref: ${{ steps.pins.outputs.std }}
          path: std
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
      - name: Checkout stock Kani
        timeout-minutes: 4
        uses: actions/checkout@v6
        with:
          repository: model-checking/kani
          ref: ${{ steps.pins.outputs.tool }}
          path: tool
          fetch-depth: 2
          persist-credentials: false
          submodules: recursive
      - name: Check source pins and materialize the overlay object
        timeout-minutes: 3
        run: python3 -B control/ch8-cal1/run.py sources
      - name: Install pinned Kani dependencies
        timeout-minutes: 15
        uses: ./tool/.github/actions/setup
        with:
          os: ubuntu-24.04
          kani_dir: tool
      - name: Build Kani, preflight the overlay and compare exact discovery
        timeout-minutes: 56
        run: python3 -B control/ch8-cal1/run.py prepare
      - name: Run the stock-pipe left S8 and u64 control, then the Wide control behind the relay
        timeout-minutes: 16
        run: python3 -B control/ch8-cal1/run.py measure
      - name: Finalize bounded receipts
        id: finish
        if: always() && steps.pins.outcome == 'success' && steps.pins.outputs.trigger_admitted == 'true'
        timeout-minutes: 6
        env:
          REV2_JOB_STATUS: ${{ job.status }}
        run: python3 -B control/ch8-cal1/run.py finish
      - name: Admit upload within the absolute publication window
        id: upload_gate
        if: always() && steps.pins.outcome == 'success' && steps.pins.outputs.trigger_admitted == 'true' && steps.finish.outcome == 'success'
        timeout-minutes: 1
        run: python3 -B control/ch8-cal1/run.py upload-gate
      - name: Upload bounded structured receipts
        id: upload
        if: always() && steps.pins.outcome == 'success' && steps.pins.outputs.trigger_admitted == 'true' && steps.finish.outcome == 'success' && steps.upload_gate.outcome == 'success'
        timeout-minutes: 7
        uses: actions/upload-artifact@v4
        with:
          name: ch8-rev2-gen-stable-n32-closure-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REV2_STATE }}/artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Check upload completed within the publication window
        if: always() && steps.upload.outcome == 'success'
        timeout-minutes: 1
        run: python3 -B control/ch8-cal1/run.py upload-check
