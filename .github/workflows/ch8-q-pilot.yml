name: CH8 q-threshold research pilot
'on':
  push:
    branches:
    - uninit-ci/ch8-q-pilot-v1
permissions:
  contents: read
concurrency:
  group: ch8-s2-fork
  cancel-in-progress: false
jobs:
  q_pilot:
    if: ${{ github.repository == 'Tiramisu-Cake/kani' && github.event_name == 'push' && github.ref == 'refs/heads/uninit-ci/ch8-q-pilot-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Define runner paths
      timeout-minutes: 1
      run: |
        {
          echo "RECEIPT_ROOT=$RUNNER_TEMP/ch8-q-pilot"
          echo "JOB_EPOCH=$RUNNER_TEMP/ch8-q-pilot-job-epoch"
          echo "SETUP_EPOCH=$RUNNER_TEMP/ch8-q-pilot-setup-epoch"
          echo "SETUP_RECEIPT=$RUNNER_TEMP/ch8-q-pilot-setup/receipt.json"
        } >> "$GITHUB_ENV"
    - name: Record job and setup start
      timeout-minutes: 1
      run: |
        python3 - <<'PYCODE'
        import os, time
        from pathlib import Path
        Path(os.environ["JOB_EPOCH"]).write_text(str(time.monotonic()))
        Path(os.environ["SETUP_EPOCH"]).write_text(str(time.time()))
        PYCODE
    - name: Checkout control
      timeout-minutes: 2
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: control
        fetch-depth: 2
        persist-credentials: false
    - name: Validate frozen control and synthetic runner
      id: control
      timeout-minutes: 2
      working-directory: control/ch8-q-pilot-control
      run: |
        python3 run.py validate
        python3 -m unittest -v test_run.py
    - name: Read immutable pins
      timeout-minutes: 1
      id: pins
      run: |
        python3 - <<'PYCODE'
        import json, os
        r=json.load(open('control/ch8-q-pilot-control/CI-REQUEST.json'))
        assert r['status']=='READY'
        with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('std='+r['std_sha']+'\n')
            f.write('tool='+r['tool_sha']+'\n')
        PYCODE
    - name: Checkout exact std source
      timeout-minutes: 5
      uses: actions/checkout@v6
      with:
        repository: Tiramisu-Cake/verify-rust-std
        ref: ${{ steps.pins.outputs.std }}
        path: export
        fetch-depth: 2
        persist-credentials: false
        submodules: true
    - name: Checkout exact Kani tool
      timeout-minutes: 2
      uses: actions/checkout@v6
      with:
        repository: model-checking/kani
        ref: ${{ steps.pins.outputs.tool }}
        path: tool
        fetch-depth: 2
        persist-credentials: false
    - name: Check source and tool identities
      id: source
      timeout-minutes: 1
      run: python3 control/ch8-q-pilot-control/run.py check-source --std export --tool tool
    - name: Setup exact stock tool
      id: setup
      timeout-minutes: 15
      uses: ./tool/.github/actions/setup
      with:
        os: ubuntu-24.04
        kani_dir: tool
    - name: Build exact stock tool once
      id: build
      timeout-minutes: 15
      working-directory: tool
      env:
        CARGO_BUILD_JOBS: '1'
      run: python3 ../control/ch8-s1-control/check_package.py build --tool . --epoch "$SETUP_EPOCH" --out "$RUNNER_TEMP/ch8-q-pilot-setup"
    - name: Run seven q-pilot roots
      id: collection
      run: >-
        python3 control/ch8-q-pilot-control/run.py run --std export --tool tool
        --out "$RECEIPT_ROOT" --setup-receipt "$SETUP_RECEIPT" --job-epoch "$JOB_EPOCH"
    - name: Materialize bounded result fallback
      id: finalize
      if: always()
      timeout-minutes: 2
      env:
        JOB_STATUS: ${{ job.status }}
        CONTROL_OUTCOME: ${{ steps.control.outcome }}
        SOURCE_OUTCOME: ${{ steps.source.outcome }}
        SETUP_OUTCOME: ${{ steps.setup.outcome }}
        BUILD_OUTCOME: ${{ steps.build.outcome }}
        COLLECTION_OUTCOME: ${{ steps.collection.outcome }}
      run: >-
        python3 control/ch8-q-pilot-control/run.py finish --std export --tool tool
        --out "$RECEIPT_ROOT" --setup-receipt "$SETUP_RECEIPT"
    - name: Upload bounded structured evidence
      if: always() && steps.finalize.outcome == 'success'
      timeout-minutes: 6
      uses: actions/upload-artifact@v4
      with:
        name: ch8-q-pilot-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.RECEIPT_ROOT }}/artifact/
        if-no-files-found: warn
        retention-days: 7
