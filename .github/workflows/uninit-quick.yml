# CI-only: fast feedback for uninit-checks work. Builds Kani and runs only the suites that use -Z uninit-checks.
name: C2-S4 candidate (unit, llbc build, capture, uninit quick)
on:
  push:
    branches:
      - 'uninit-ci/**'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  KANI_FAIL_ON_UNEXPECTED_DESCRIPTION: "true"

jobs:
  uninit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Format check
        run: ./scripts/kani-fmt.sh --check

      - name: Build Kani
        if: ${{ !cancelled() }}
        run: cargo build-dev

      - name: Clippy (-D warnings)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Unit tests (delayed cache, scope, immutable)
        if: ${{ !cancelled() }}
        run: |
          cargo test -p kani-compiler delayed_cache::tests -- --nocapture
          cargo test -p kani-compiler delayed_scope_tests -- --nocapture
          cargo test -p kani-compiler immutable_allocations::tests

      - name: Capture unbound composition inventories
        if: ${{ !cancelled() }}
        shell: bash {0}
        run: |
          export PATH="$(pwd)/scripts:$PATH"
          export KANI_LOG=kani_compiler::kani_middle::codegen_units=debug
          python3 tests/json-handler/uninit-part1-composition/run.py --kani "$(pwd)/scripts/kani" --collect-unbound --keep-output
          rc=$?
          echo "capture exit=$rc (2 = UNBOUND_CAPTURE expected)"
          [ "$rc" = 2 ] || exit 1

      - name: Uninit suites
        if: ${{ !cancelled() }}
        run: |
          export PATH="$(pwd)/scripts:$PATH"
          rc=0
          export RUST_TEST_THREADS=2
          ( while sleep 30; do free -m | awk '/Mem:/{print "MEM used_mb="$3" avail_mb="$7}'; done ) &
          mp=$!
          run() { echo "::group::$*"; cargo run -p compiletest --quiet -- "$@" --no-fail-fast --timeout 2400 || rc=1; echo "::endgroup::"; }
          run --suite kani --mode kani Uninit Quantifiers TailCall
          run --suite expected --mode expected uninit quantifier-capture arbitrary
          run --suite ui --mode expected quantifier-safety-checks explicit-tail-calls
          run --suite script-based-pre --mode exec mem-init-reinstrumentation autoharness_explicit_tail_call
          run --suite json-handler --mode exec uninit-contract uninit-part1
          kill $mp || true
          exit $rc

      - name: LLBC feature build
        if: ${{ !cancelled() }}
        run: cargo build-dev -- --features cprover --features llbc

      - name: Upload oracle artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: s4-candidate-artifacts
          path: |
            /tmp/kani-uninit-contract-oracles-*/
            /tmp/tmp*/mode-boundary-results/
            /tmp/kani-uninit-part1-composition-*/
          if-no-files-found: warn
          retention-days: 7
