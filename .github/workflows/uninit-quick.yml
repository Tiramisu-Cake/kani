# CI-only: fast feedback for uninit-checks work. Builds Kani and runs only the suites that use -Z uninit-checks.
name: Uninit Quick (closure-zst only)
on:
  push:
    branches:
      - 'uninit-ci/**'
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  KANI_FAIL_ON_UNEXPECTED_DESCRIPTION: "true"

jobs:
  uninit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout Kani
        uses: actions/checkout@v6

      - name: Setup Kani Dependencies
        uses: ./.github/actions/setup
        with:
          os: ubuntu-24.04

      - name: Build Kani
        if: ${{ !cancelled() }}
        run: cargo build-dev

      - name: Uninit suites
        if: ${{ !cancelled() }}
        run: |
          export PATH="$(pwd)/scripts:$PATH"
          rc=0
          run() { echo "::group::$*"; cargo run -p compiletest --quiet -- "$@" --no-fail-fast --timeout 600 || rc=1; echo "::endgroup::"; }
          export RUST_TEST_THREADS=2
          ( while sleep 20; do free -m | awk '/Mem:/{print "MEM used_mb="$3" avail_mb="$7}'; done ) &
          mp=$!
          run --suite expected --mode expected closure-zst
          kill $mp || true
          exit $rc
